name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
      - name: Read app version
        id: app-version
        working-directory: android-app
        run: |
          VERSION=$(awk -F"'" '/versionName/ {print $2; exit}' app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Name APK with version
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "android-app/app/build/outputs/apk/debug/work-hours-journal-v${VERSION}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: work-hours-journal-v${{ steps.app-version.outputs.version }}
          path: android-app/app/build/outputs/apk/debug/work-hours-journal-v${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

  publish-apk:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: work-hours-journal-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish APK as a direct release download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/work-hours-journal-v${VERSION}.apk" \
            --title "工时日记 v${VERSION}" \
            --notes "Android APK 安装包。包含月度视图、每日工时结算、WebDAV 云同步和当前时间快速打卡。"

